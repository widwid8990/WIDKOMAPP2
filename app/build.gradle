plugins {
    id 'com.android.application'
}

android {
    namespace 'id.widkom.app'
    compileSdk 34

    defaultConfig {
        applicationId "id.widkom.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Keystore tetap supaya APK baru bisa menimpa (update) APK lama tanpa uninstall
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
